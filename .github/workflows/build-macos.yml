name: build-macos

# 在 macOS 上构建 Our Free Model 桌面壳的 .dmg（未签名，本地使用需绕过 Gatekeeper）。
# 手动触发，或在打 v* 标签时自动构建并上传为构件。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          npm install
          npm --prefix packages/standalone ci
          node scripts/build-standalone-ui.mjs
          npm --prefix packages/desktop ci --ignore-scripts
      - name: Build macOS dmg
        env:
          CI: true
        run: npm --prefix packages/desktop run build
      - name: Upload dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ofm-desktop-macos
          path: packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
